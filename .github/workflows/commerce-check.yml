name: WMS local checks
on:
  push:
    branches: [feature/bol-orders-warehouse, engineering/**, phase/wms/**]
  pull_request:
    branches: [main, feature/bol-orders-warehouse, engineering/**]
permissions:
  contents: read
concurrency:
  group: wms-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --version
      - run: node scripts/wms/foundation-check.mjs
      - run: node --test tests/foundation/*.test.mjs
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [unit, typecheck, build, lint]
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-public-build-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - name: Install from existing lock without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run independent local check and retain log
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence-local
          case "${{ matrix.check }}" in
            unit) bun test ./tests/*.test.ts 2>&1 | tee evidence-local/unit.log ;;
            typecheck) bunx --no-install tsc --noEmit 2>&1 | tee evidence-local/typecheck.log ;;
            build) bun run build 2>&1 | tee evidence-local/build.log ;;
            lint) bun run lint 2>&1 | tee evidence-local/lint.log ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wms-local-${{ matrix.check }}-${{ github.sha }}
          path: evidence-local/
          if-no-files-found: warn
          retention-days: 7
