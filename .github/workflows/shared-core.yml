name: Shared Core Preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  shared-core-consistency:
    name: Shared authority and held execution (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify shared contract, captured evidence and authorization holds
        run: python3 ci/check_shared_core.py
      - name: Regress unauthorized direction promotion and duplicate authority
        run: python3 -m unittest discover -s tests/shared_core -v
